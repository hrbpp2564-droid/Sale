<script>
  // Light is the default now. The bundle reads localStorage('vantage.theme')
  // and falls back to 'dark', and it is compiled, so seed the value here
  // instead — before it runs, and only when the visitor has no saved choice,
  // so anyone who picked dark keeps dark.
  try {
    if (!localStorage.getItem('vantage.theme')) localStorage.setItem('vantage.theme', 'light');
    var _t = localStorage.getItem('vantage.theme');
    document.documentElement.setAttribute('data-theme', _t);
    document.addEventListener('DOMContentLoaded', function () { document.body.setAttribute('data-theme', _t); });
  } catch (e) {}
</script>
